services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marketsense
      MYSQL_USER: marketsense
      MYSQL_PASSWORD: marketsense
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - marketsense_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  marketsense_mysql:
